# SECOND WORLD CI (docs/12-testing-and-quality.md §5).
# - test: OS × Node matrix — lint, typecheck, unit, integration, e2e, build, packed-tarball smoke.
#   Docker is hidden from these jobs (DOCKER_HOST points at a closed port) so the live Docker tests
#   skip everywhere: GitHub's Windows runners only run Windows containers and macOS runners have no
#   daemon, which would make results differ per OS.
# - docker / podman: Linux jobs that run the Docker-backed tests against a real container runtime.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  FORCE_COLOR: "0"
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.x", "24.x"]
    env:
      # Unreachable daemon → tests/integration/docker/helpers.ts `docker info` fails → live Docker tests skip.
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint (biome, warnings are errors)
        run: npm run lint -- --error-on-warnings
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
      - name: Pack and install the tarball into a fresh project
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          smoke="$RUNNER_TEMP/sw-smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/second-world-*.tgz
          npx sw --version
          npx sw doctor
          npx sw init --target http://127.0.0.1:3000
          npx sw config validate

  docker:
    name: docker-backed tests (ubuntu, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # The same probe tests/integration/docker/helpers.ts uses; if it fails the live tests would only skip.
      - name: Container runtime is visible to the tests
        run: docker version --format '{{.Server.Version}}' || docker info --format '{{.Version.Version}}'
      - name: Live Docker tests
        run: npx vitest run tests/integration/docker tests/e2e/evolve-cli.test.ts

  podman:
    name: docker-backed tests (ubuntu, podman)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Podman support is not verified yet (the code drives the `docker` CLI and probes with
    # `docker version --format '{{.Server.Version}}' || docker info --format '{{.Version.Version}}'`). Remove once this job has passed on GitHub.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install podman and use it as `docker`
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          # SECOND WORLD and the tests call the `docker` CLI; a shim earlier on PATH sends every call to
          # rootless podman, and the Docker daemon is stopped so nothing can silently fall back to it.
          sudo systemctl stop docker.socket docker.service
          shim="$RUNNER_TEMP/podman-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec podman "$@"\n' > "$shim/docker"
          chmod +x "$shim/docker"
          echo "$shim" >> "$GITHUB_PATH"
          # Short image names (node:22-alpine) resolve on Docker Hub, as with docker.
          mkdir -p ~/.config/containers
          printf 'unqualified-search-registries = ["docker.io"]\n' > ~/.config/containers/registries.conf
      # The same probe tests/integration/docker/helpers.ts uses; if it fails the live tests would only skip.
      - name: Container runtime is visible to the tests
        run: docker version --format '{{.Server.Version}}' || docker info --format '{{.Version.Version}}'
      - name: Live Docker tests (podman)
        run: npx vitest run tests/integration/docker tests/e2e/evolve-cli.test.ts
