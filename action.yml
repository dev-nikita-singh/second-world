# SECOND WORLD GitHub Action (composite). Runs one `sw` command against a service the workflow has
# started on the runner, writes report.json + report.sarif, and optionally uploads the SARIF to GitHub
# code scanning. The step fails with sw's exit code (docs/09-cli-and-api.md, README "Exit codes") after
# the upload, so findings are visible even when the gate fails.
name: SECOND WORLD
description: Deterministic local API testing (performance, stress, bug hunting, architecture) with SARIF output
author: SECOND WORLD contributors
branding:
  icon: activity
  color: blue

inputs:
  command:
    description: "sw command, e.g. `perf`, `stress`, `bugs`, `inspect`, `reliability run <scenario>` (split on spaces)"
    required: false
    default: perf
  config:
    description: Path to sw.config.* (relative to working-directory). Empty = auto-discover.
    required: false
    default: ""
  target:
    description: Target URL or target name, passed as `--target` (perf, stress, bugs, agent, replay, reliability run)
    required: false
    default: ""
  args:
    description: Extra arguments after the command, split on spaces (no shell quoting), e.g. `--duration 30s --fail-on medium`
    required: false
    default: ""
  upload-sarif:
    description: "`true` uploads report.sarif with github/codeql-action/upload-sarif (needs `permissions: security-events: write`)"
    required: false
    default: "false"
  sarif-category:
    description: Code-scanning category, so several sw runs in one workflow do not replace each other
    required: false
    default: second-world
  out-dir:
    description: Report directory (relative to working-directory; must stay inside the workspace for the upload)
    required: false
    default: .second-world/action-report
  working-directory:
    description: Folder of the project under test
    required: false
    default: "."
  package:
    description: npm package spec used when second-world is not installed in working-directory (e.g. `second-world@0.1.0` or a .tgz path)
    required: false
    default: second-world
  node-version:
    description: Node.js version to set up (>= 22.19). Empty = use the Node already on PATH.
    required: false
    default: "24.x"

outputs:
  exit-code:
    description: Exit code of sw (0 pass, 1 findings/thresholds, 2 config, 3 safety, 4 capability, 5 target unreachable)
    value: ${{ steps.run.outputs.exit-code }}
  report-dir:
    description: Absolute path of the report directory
    value: ${{ steps.run.outputs.report-dir }}
  sarif-file:
    description: Absolute path of report.sarif (empty if the command wrote none)
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - if: inputs.node-version != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SW_IN_COMMAND: ${{ inputs.command }}
        SW_IN_CONFIG: ${{ inputs.config }}
        SW_IN_TARGET: ${{ inputs.target }}
        SW_IN_ARGS: ${{ inputs.args }}
        SW_IN_OUT: ${{ inputs.out-dir }}
        SW_IN_PACKAGE: ${{ inputs.package }}
      run: |
        set -uo pipefail
        # Native absolute path (on Windows runners `pwd` would give /d/a/... which JS actions cannot read).
        out="$(node -e 'const d=require("node:path").resolve(process.argv[1]);require("node:fs").mkdirSync(d,{recursive:true});console.log(d)' "$SW_IN_OUT")" || exit 1
        # Inputs are split on whitespace into an argv array; nothing goes through a shell eval.
        read -ra cmd <<< "$SW_IN_COMMAND"
        read -ra extra <<< "$SW_IN_ARGS"
        argv=(-f tty,json,sarif -o "$out")
        if [ -n "$SW_IN_CONFIG" ]; then argv+=(-c "$SW_IN_CONFIG"); fi
        argv+=("${cmd[@]}")
        if [ -n "$SW_IN_TARGET" ]; then argv+=(--target "$SW_IN_TARGET"); fi
        argv+=("${extra[@]}")
        if [ -x node_modules/.bin/sw ] || [ -f node_modules/.bin/sw.cmd ]; then
          runner=(npx --no-install sw)
        else
          runner=(npx --yes --package "$SW_IN_PACKAGE" sw)
        fi
        echo "::group::${runner[*]} ${argv[*]}"
        "${runner[@]}" "${argv[@]}"
        code=$?
        echo "::endgroup::"
        sarif=""
        if [ -f "$out/report.sarif" ]; then sarif="$out/report.sarif"; fi
        {
          echo "exit-code=$code"
          echo "report-dir=$out"
          echo "sarif-file=$sarif"
        } >> "$GITHUB_OUTPUT"
        echo "sw exited $code; reports in $out"

    - if: inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - if: steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        SW_EXIT: ${{ steps.run.outputs.exit-code }}
      run: |
        echo "::error::SECOND WORLD exited $SW_EXIT (1 = findings or thresholds at/above --fail-on; see the report)"
        exit "$SW_EXIT"
